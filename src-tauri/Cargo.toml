[package]
name = "sufler"
version = "0.1.9"
description = "Суфлёр — системный AI-попап по выделению текста"
authors = ["Sufler"]
edition = "2021"
rust-version = "1.77"

[lib]
# staticlib/cdylib нужны для сборки под Android и iOS (`tauri android`/`tauri ios`),
# rlib — чтобы main.rs мог использовать библиотеку на десктопе.
name = "sufler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# macos-private-api включён под прозрачное окно попапа на macOS — этого требует
# `macOSPrivateApi: true` в tauri.conf.json. Учтите при публикации в Mac App Store:
# приложения с приватным API туда не принимают, для стора нужна сборка без прозрачности.
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }
# TLS — системный (schannel на Windows, Security.framework на macOS, OpenSSL на Linux).
# Так приложение автоматически доверяет корпоративным корневым сертификатам, а сборка
# не требует C-тулчейна для aws-lc/ring, которого на машинах разработки может не быть.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "native-tls",
  # socks нужен ради адресов вида socks5://127.0.0.1:1080 — именно такой поднимает
  # у себя большинство VPN-клиентов. Без этой фичи reqwest понимает только http-прокси.
  "socks",
  # system-proxy тоже из дефолтных. Без неё клиент не видит ни настройки прокси
  # Windows, ни переменные HTTP_PROXY/HTTPS_PROXY: у человека браузер ходит через
  # прокси, а Суфлёр молча — нет. Ручное поле прокси остаётся главнее: явный
  # .proxy() перекрывает системный.
  "system-proxy",
  # charset нужен для ответов не в UTF-8: без неё их текст разбирается как попало.
  "charset",
  # http2 входит в дефолтные фичи, а мы их выключили — и вместе с ними потеряли h2.
  # Само по себе это было бы полбеды, но native-tls объявляет в ALPN поддержку h2,
  # и сервер её принимает: и api.groq.com, и Википедия отвечают по HTTP/2. Клиент,
  # собранный без этой фичи, на таком соединении паникует («http2 feature is not
  # enabled»), то есть падал каждый запрос к модели и к словарю.
  "http2",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  # SafeArray* и CF_UNICODETEXT живут в OleAut32, а не в Com.
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  # CreateMutexW/CreateEventW принимают атрибуты безопасности, поэтому живут за этой
  # фичей — даже когда атрибуты не нужны и передаётся None.
  "Win32_Security",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Только CFString/CFRelease. Функции Accessibility API и CoreGraphics объявлены
# вручную в selection/macos.rs: обёрточных крейтов для AX нужного качества нет,
# а структуры CGRect/CFRange — три строки на repr(C).
core-foundation = "0.10"

[features]
# По умолчанию Tauri сам выбирает нужное; кастомных фич у приложения нет.
default = []
