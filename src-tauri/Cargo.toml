[package]
name = "sufler"
version = "1.4.0"
description = "Суфлёр — системный AI-попап по выделению текста"
authors = ["Sufler"]
edition = "2021"
rust-version = "1.77"

[lib]
# staticlib/cdylib нужны для сборки под Android и iOS (`tauri android`/`tauri ios`),
# rlib — чтобы main.rs мог использовать библиотеку на десктопе.
name = "sufler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# macos-private-api включён под прозрачное окно попапа на macOS — этого требует
# `macOSPrivateApi: true` в tauri.conf.json. Учтите при публикации в Mac App Store:
# приложения с приватным API туда не принимают, для стора нужна сборка без прозрачности.
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# chrono — сроки задач. Нужны разбор и сложение дат с учётом часового пояса
# и високосных лет: «завтра в три» и «через неделю» вручную не считаются.
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }

# reqwest объявлен дважды — из-за TLS, и только из-за него. Общие фичи одинаковы:
#
#   socks — ради адресов вида socks5://127.0.0.1:1080: именно такой поднимает у себя
#     большинство VPN-клиентов. Без этой фичи reqwest понимает только http-прокси.
#   system-proxy — иначе клиент не видит ни настройки прокси Windows, ни переменные
#     HTTP_PROXY/HTTPS_PROXY: у человека браузер ходит через прокси, а Суфлёр молча
#     нет. Ручное поле прокси остаётся главнее: явный .proxy() перекрывает системный.
#   charset — для ответов не в UTF-8: без неё их текст разбирается как попало.
#   http2 — входит в дефолтные фичи, а мы их выключили и вместе с ними потеряли h2.
#     Само по себе полбеды, но TLS объявляет в ALPN поддержку h2, и сервер её
#     принимает: и api.groq.com, и Википедия отвечают по HTTP/2. Клиент без этой
#     фичи на таком соединении паникует — падал каждый запрос к модели и к словарю.

# На настольных системах TLS системный (schannel на Windows, Security.framework
# на macOS, OpenSSL на Linux): приложение автоматически доверяет корпоративным
# корневым сертификатам, а сборка не требует C-тулчейна для aws-lc/ring.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  # multipart — записью с микрофона кормится whisper-server, а он принимает
  # только форму с файлом.
  "multipart",
  # form — Google меняет коды на ключи только формой, JSON он на этой ручке
  # не принимает.
  "form",
  "native-tls",
  "socks",
  "system-proxy",
  "charset",
  "http2",
] }

# На Android системного OpenSSL нет, и native-tls тянет за собой openssl-sys,
# который под aarch64-linux-android не собирается вовсе — именно на нём падала
# сборка .apk во всех выпусках. Здесь TLS свой, на rustls.
#
# webpki-roots нужен вместе с ним: rustls сам по себе не знает, кому доверять,
# а системного хранилища сертификатов, откуда их взять, на Android для нас нет.
# Эта фича вшивает список корневых центров в приложение.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "form",
  "rustls",
  "webpki-roots",
  "socks",
  "system-proxy",
  "charset",
  "http2",
] }

# Автозапуск вместе с системой. Официальный плагин, а не своя запись в реестре:
# на каждой системе это делается по-своему (ключ Run в реестре, LaunchAgent на
# macOS, .desktop в autostart на Linux), и держать три реализации ради одной
# галочки незачем. На телефонах понятия «автозапуск при входе» нет вовсе,
# поэтому только настольные системы.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

# Голос: синтез речи и микрофон.
#
# Только настольные системы. На телефоне и то и другое есть в самой ОС и делается
# совершенно иначе, а бинарники Piper и whisper.cpp собраны не под Android.
#
# rodio — воспроизведение. Нужен потоковый источник: Piper отдаёт готовые куски
#   звука по мере синтеза, и ждать конца фразы, чтобы начать говорить, незачем.
# cpal — запись с микрофона для распознавания. rodio тянет его и сам, но зависимость
#   объявлена явно: мы обращаемся к нему напрямую, а не через rodio.
#
#   ВЕРСИЯ ОБЯЗАНА СОВПАДАТЬ С ТОЙ, ЧТО ТЯНЕТ RODIO. Иначе в программе окажутся
#   две копии cpal, а у каждой — свой COM-объект перечисления устройств Windows,
#   создаваемый один раз на процесс. Две такие копии в одном процессе спорят за
#   одно и то же состояние WASAPI, и рано или поздно одна остаётся ни с чем:
#   колонки отвечают «устройства нет», микрофон пишет тишину — до перезапуска.
#   Так и было: голос пропадал «сам собой» и возвращался только с перезапуском.
#   Проверять после каждого обновления rodio: `cargo tree | grep cpal` должен
#   показывать ровно одну версию.
# zip — распаковать архив Piper после загрузки.
rodio = "0.21"
cpal = "0.16"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  # SafeArray* и CF_UNICODETEXT живут в OleAut32, а не в Com.
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  # Задания (job objects): дочерние процессы должны уходить вместе с нами,
  # в том числе когда программу снимают из диспетчера задач.
  "Win32_System_JobObjects",
  # GlobalMemoryStatusEx — сколько на машине оперативной памяти. По этому числу
  # и по видеопамяти подбирается модель при первом запуске (ollama::pick).
  "Win32_System_SystemInformation",
  # CreateMutexW/CreateEventW принимают атрибуты безопасности, поэтому живут за этой
  # фичей — даже когда атрибуты не нужны и передаётся None.
  "Win32_Security",
  # CryptProtectData/CryptUnprotectData — шифрование ключа AI-сервиса средствами
  # системы: расшифровать сможет только та же учётная запись на той же машине.
  "Win32_Security_Cryptography",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Только CFString/CFRelease. Функции Accessibility API и CoreGraphics объявлены
# вручную в selection/macos.rs: обёрточных крейтов для AX нужного качества нет,
# а структуры CGRect/CFRange — три строки на repr(C).
core-foundation = "0.10"

[features]
# По умолчанию Tauri сам выбирает нужное; кастомных фич у приложения нет.
default = []
