<!doctype html>
<html lang="ru" data-theme="neon" data-surface="opaque">
  <head>
    <meta charset="utf-8" />
    <title>Кадр для README</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../src/styles/fonts.css" />
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="../../src/styles/popup.css" />
    <link rel="stylesheet" href="../../src/styles/hud.css" />
    <style>
      /* Сцена — не часть программы, а подложка под неё: страница, которую
         человек читает, когда встречает незнакомое слово. Всё остальное на
         кадре настоящее — та же разметка, те же стили, те же шрифты. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg-solid);
        font-family: var(--font-ui);
        color: var(--text-muted);
        -webkit-font-smoothing: antialiased;
      }
      .page {
        position: absolute;
        inset: 0;
        padding: 46px 56px;
        font-size: 16.5px;
        line-height: 1.75;
        letter-spacing: 0.005em;
        max-width: 760px;
      }
      .page b {
        font-weight: inherit;
        color: var(--text-body);
      }
      .sel {
        background: rgba(120, 160, 255, 0);
        border-radius: 2px;
        padding: 1px 0;
        color: inherit;
        transition: none;
      }
      .stage {
        position: absolute;
        opacity: 0;
        transform: translateY(6px) scale(0.985);
        transform-origin: 20px 0;
      }
      .hudwrap {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        opacity: 0;
      }
      .caption {
        position: absolute;
        left: 50%;
        top: 172px;
        transform: translateX(-50%);
        font-size: 15px;
        color: var(--text);
        white-space: nowrap;
        opacity: 0;
      }
      .caption i {
        font-style: normal;
        color: var(--accent);
      }
      canvas {
        display: block;
      }
      .modes {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background:
          radial-gradient(ellipse 60% 55% at 50% 42%, color-mix(in oklab, var(--accent) 9%, transparent), transparent 70%),
          var(--bg-solid);
      }
      .modes__brand {
        position: absolute;
        left: 28px;
        top: 22px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 13px;
        color: var(--text-muted);
      }
      .modes__brand b {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.02em;
      }
      .modes__hud {
        width: 540px;
        height: 270px;
        margin-top: 24px;
      }
      .modes__line {
        height: 34px;
        margin-top: 6px;
        font-size: 21px;
        color: var(--text);
        white-space: nowrap;
      }
      .modes__line i {
        font-style: normal;
        color: var(--accent);
      }
      .modes__line--note {
        font-size: 16px;
        color: var(--text-muted);
      }
      .modes__line--answer {
        color: oklch(0.85 0.1 290);
      }
      .modes__steps {
        display: flex;
        gap: 10px;
        margin: 26px 0 0;
        padding: 0;
        list-style: none;
        counter-reset: step;
      }
      .modes__steps li {
        padding: 7px 14px;
        border: 1px solid color-mix(in oklab, var(--text-muted) 30%, transparent);
        border-radius: 999px;
        font-size: 13.5px;
        color: var(--text-muted);
      }
      .modes__steps li.is-done {
        color: var(--text-body);
        border-color: color-mix(in oklab, var(--accent) 35%, transparent);
      }
      .modes__steps li.is-on {
        color: var(--bg-solid);
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 18px color-mix(in oklab, var(--accent) 60%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="page" id="page"></div>
    <div class="hudwrap" id="hudwrap"><canvas id="hud" width="360" height="180"></canvas></div>
    <div class="caption" id="caption"></div>
    <div class="stage" id="stage"></div>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
