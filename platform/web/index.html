<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOAH — модули для ИИ-помощника</title>
    <meta name="description" content="NOAH — мультимодальная оболочка для ИИ. Подключите любую нейросеть и соберите модуль под свою задачу за пару минут, без программирования." />
    <link rel="icon" href="assets/noah-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1a1d26" />
    <meta name="apple-mobile-web-app-title" content="NOAH" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифты не задерживают страницу: текст сразу виден системным шрифтом,
         свои подменяют его, когда догрузятся (подключает app.js). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="styles.css?v=40" />
    <link rel="stylesheet" href="home.css?v=40" />
    <link rel="modulepreload" href="core.js?v=40" />
    <link rel="modulepreload" href="links.js?v=40" />
    <link rel="modulepreload" href="i18n.js?v=40" />
    <link rel="modulepreload" href="home.js?v=40" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-memory" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" /><path d="M10 4v3M14 4v3M10 17v3M14 17v3M4 10h3M4 14h3M17 10h3M17 14h3" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-files" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-browser" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 9h18M7 7h.01M10 7h.01" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-legal" viewBox="0 0 24 24"><path d="M12 4v16M7 20h10M12 7l7 2-2.5 4a3 3 0 0 0 5 0L19 9M12 7L5 9l2.5 4a3 3 0 0 1-5 0L5 9" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-mail" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M4 8l8 5 8-5" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-notes" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" /><path d="M8 9h8M8 13h8M8 17h5" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="ic-code" viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" /></symbol>
      <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="M16 16l4 4" /></symbol>
    </svg>

    <div class="shell">
      <aside class="side">
        <a class="brand" href="#/">
          <span class="brand__mark"><img src="assets/noah-mark.svg" alt="" /></span>
          <span class="brand__name">NOAH</span>
          <span class="brand__ver" data-el="version"></span>
        </a>
        <nav class="side__nav" data-el="nav"></nav>
        <div class="side__foot">
          <a class="side__app" data-el="download">
            <span class="side__dot"></span>
            <span class="mono" data-t="brainLabel"></span>
            <strong data-t="brainValue"></strong>
            <span class="side__sub" data-t="brainLocal"></span>
          </a>
          <a class="side__me" href="#/login" data-el="sideGuest">
            <span class="avatar">?</span>
            <span class="side__who">
              <strong data-t="signIn"></strong>
              <span class="mono" data-t="sellerRole"></span>
            </span>
          </a>
          <a class="side__me" href="#/seller" data-el="sideMe" hidden>
            <span class="avatar" data-el="sideAvatar"></span>
            <span class="side__who">
              <strong data-el="sideName"></strong>
              <span class="mono" data-t="sellerRole"></span>
            </span>
          </a>
        </div>
      </aside>

      <div class="main">
        <header class="top">
          <a class="mhead" href="#/">
            <span class="mhead__mark"><img src="assets/noah-mark.svg" alt="NOAH" /></span>
            <span class="mhead__name">NOAH</span>
          </a>
          <a class="top__docs" href="#/docs" data-t="navDocsFull"></a>
          <div class="langpick" data-el="langPick">
            <button type="button" class="langpick__btn" data-el="langBtn" aria-haspopup="true" aria-expanded="false"></button>
            <div class="langpick__list" data-el="langList" hidden>
              <button type="button" data-lang="en">EN · English</button>
              <button type="button" data-lang="ru">RU · Русский</button>
            </div>
          </div>
          <button type="button" class="searchbtn" data-el="searchBtn" aria-label="Search">
            <svg><use href="#ic-search"></use></svg>
          </button>
          <label class="search" data-el="searchBox">
            <span class="mono">/</span>
            <input type="search" data-el="search" autocomplete="off" />
            <span class="kbd">⌘K</span>
          </label>
          <div class="seg">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="ru">RU</button>
          </div>
          <a class="btn btn--gold cta" href="#/connect" data-t="newModule"></a>
          <div class="top__auth" data-el="guest">
            <a class="top__link" href="#/login" data-t="signIn"></a>
            <a class="iconbtn" href="#/login" data-el="signInIcon"><svg><use href="#ic-user"></use></svg></a>
            <a class="btn btn--ghost" href="#/signup" data-t="signUp"></a>
          </div>
          <button type="button" class="me" data-el="meBtn" hidden>
            <span class="avatar" data-el="meAvatar"></span>
            <span class="me__name" data-el="meName"></span>
            <span class="me__name me__caret">▼</span>
          </button>
          <div class="menu" data-el="menu" hidden>
            <div class="menu__head">
              <strong data-el="menuName"></strong>
              <span class="mono" data-el="menuEmail"></span>
            </div>
            <div data-el="menuItems"></div>
            <button type="button" class="menu__out" data-el="signOut" data-t="signOut"></button>
          </div>
        </header>

        <main class="page" data-el="page"></main>

        <footer class="foot">
          <div class="foot__cols" data-el="footCols"></div>
          <div class="foot__line">
            <span>© 2026 NOAH</span>
            <span class="grow"></span>
            <a href="#/privacy" data-t="privacy"></a>
            <a href="#/terms" data-t="terms"></a>
            <a href="https://github.com/faafaafuu/asis/issues" target="_blank" rel="noopener" data-t="contact"></a>
          </div>
        </footer>
      </div>
    </div>

    <div class="toast" data-el="toast" role="status" hidden></div>
    <script src="boot.js?v=40"></script>
    <script type="module" src="app.js?v=40"></script>
  </body>
</html>
