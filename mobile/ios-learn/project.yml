# Проект Xcode для «Ноа · Обучение» на iPhone. Сам проект не хранится:
# его собирает XcodeGen из этого файла (`xcodegen generate`), так в
# репозитории нет сотни строк машинного .pbxproj.
#
# Подписи нет намеренно: файл .ipa ставится через Sideloadly, и он
# подписывает его вашим Apple ID при установке.

name: NoahLearn
options:
  bundleIdPrefix: app.noahlab
  deploymentTarget:
    iOS: "15.0"
targets:
  NoahLearn:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Ноа · Обучение"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSMicrophoneUsageDescription: "Урок с Ноа голосом: пересказ и вопросы — вслух."
        NSSpeechRecognitionUsageDescription: "Ноа слушает пересказ урока и вопросы."
        LSApplicationQueriesSchemes:
          - tg
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noahlab.learn
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
