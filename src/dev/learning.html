<!doctype html>
<html lang="ru" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Обучение — NOAH</title>
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/learning.css" />
    <script src="../js/window-errors.js"></script>
    <script>
      // Витрина лобби курсов: подменные курсы, без программы и сайта.
      const courses = [
        { id: "devops", title: "DevOps с нуля", description: "Linux, сети, Docker, Kubernetes — до уровня собеседования.", percent: 62, topicPass: 70, finalUnlocked: false, finalBest: null, current: "docker", mastery: { total: 0 }, focus: {}, topics: [
          { id: "linux", title: "Linux", status: "done", read: true, tasksDone: 4, tasksTotal: 4, examBest: 88, mistakes: 0, conceptsTotal: 0, conceptsMature: 0, summary: "" },
          { id: "docker", title: "Docker", status: "done", read: false, tasksDone: 0, tasksTotal: 6, examBest: 90, mistakes: 0, conceptsTotal: 0, conceptsMature: 0, summary: "" } ] },
        { id: "en", title: "Английский для поездок", description: "", percent: 10, topicPass: 70, finalUnlocked: false, finalBest: null, current: null, mastery: { total: 0 }, focus: {}, topics: [
          { id: "air", title: "Аэропорт", status: "new", read: false, tasksDone: 0, tasksTotal: 3, examBest: null, mistakes: 0, conceptsTotal: 0, conceptsMature: 0, summary: "" } ] },
      ];
      globalThis.__TAURI__ = {
        core: { invoke: async (cmd) => ({ learn_overview: courses, learn_builds: [], app_version: "1.15.0", runtime_config: { theme: "noah" } })[cmd] ?? null },
        event: { listen: async () => () => {} },
        window: { getCurrentWindow: () => null },
      };
    </script>
  </head>
  <body>
    <header class="head" data-el="head">
      <h1 class="head__title" data-el="appVersion">NOAH</h1>
      <span class="head__course" data-el="courseTitle"></span>
      <div class="head__progress" title="Сколько курса пройдено">
        <span class="bar"><span class="bar__fill" data-el="courseBar"></span></span>
        <span class="head__percent" data-el="coursePercent"></span>
      </div>
      <button class="head__focus" data-el="focusChip" type="button" hidden title="Фокус-сессия: пауза, заметка на потом, стоп"></button>
      <button class="head__button" data-el="minimize" type="button" title="Свернуть" aria-label="Свернуть окно обучения">—</button>
      <button class="head__button head__close" data-el="close" type="button" title="Закрыть" aria-label="Закрыть окно обучения">×</button>
    </header>

    <div class="layout">
      <!-- Темы курса: статус, баллы, ошибки. Внизу — финальный экзамен. -->
      <nav class="side" aria-label="Темы">
        <button class="side__lobby" data-el="lobby" type="button" title="Все курсы и сборка нового">☰ Все курсы</button>
        <button class="side__home" data-el="home" type="button">Обзор курса</button>
        <ol class="topics" data-el="topics"></ol>
        <button class="side__final" data-el="final" type="button">Финальный экзамен</button>
      </nav>

      <main class="main" data-el="main"></main>
    </div>

    <!-- Фокус-сессия: подготовка, конец отрезка, перерыв. Поверх страницы,
         чтобы не терять недописанный ответ экзамена. -->
    <div class="focus-layer" data-el="focusLayer" hidden></div>

    <script type="module" src="../js/learning.js"></script>
  </body>
</html>
