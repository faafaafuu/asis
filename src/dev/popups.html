<!doctype html>
<html lang="ru" data-theme="noah">
  <head>
    <meta charset="utf-8" />
    <title>NOAH — попап: все состояния</title>
    <!-- Витрина для разработки: попап объяснения во всех состояниях и темах,
         как на опорном экране дизайна. Открывать через `npm run dev`:
         http://localhost:5173/dev/popups.html (?theme=dark — одна тема). -->
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/popup.css" />
    <style>
      body {
        margin: 0;
        background: #c9ced8;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 0;
        padding: 24px 16px 40px;
      }
      .cell {
        width: 464px;
        padding: 0 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cell > span {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
      }
      .stage {
        padding: 12px 16px 24px;
      }
      h2 {
        margin: 0;
        padding: 24px 32px 0;
        font: 600 15px "IBM Plex Sans", sans-serif;
      }
    </style>
  </head>
  <body>
    <main id="gallery"></main>
    <script type="module" src="./popups.js"></script>
  </body>
</html>
