<!doctype html>
<html lang="ru" data-theme="neon" data-scale="window-l">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Обучение — NOAH</title>
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/learning.css" />
    <link rel="stylesheet" href="./styles/guides.css" />
    <link rel="stylesheet" href="./styles/drama.css" />
    <link rel="stylesheet" href="./styles/commands.css" />
    <link rel="stylesheet" href="./styles/learn-home.css" />
    <script src="./js/window-errors.js"></script>
  </head>
  <body>
    <header class="head" data-el="head">
      <span class="head__mark"><img src="./assets/noah-mark.svg" alt="" /></span>
      <span class="head__brand" data-el="appVersion">NOAH</span>
      <span class="head__slash">/</span>
      <span class="head__crumbs" data-el="crumbs">Обучение</span>
      <span class="head__grow"></span>
      <button class="head__focus" data-el="focusChip" type="button" hidden title="Фокус-сессия: пауза, заметка на потом, стоп"></button>
      <button class="head__button" data-el="minimize" type="button" title="Свернуть" aria-label="Свернуть окно обучения"><span class="head__dash"></span></button>
      <button class="head__button head__close" data-el="close" type="button" title="Закрыть" aria-label="Закрыть окно обучения"><svg width="16" height="16" style="stroke-width: 2"><use href="#i-close"></use></svg></button>
    </header>

    <div class="layout">
      <!-- Меню (Главная · Повторение · Фокус · Путеводители), ниже — курсы на
           главной или темы курса, внизу — сборка курса или финальный экзамен. -->
      <nav class="side" aria-label="Обучение">
        <div class="side__menu" data-el="menu"></div>
        <div class="side__list"><ol class="topics" data-el="topics"></ol></div>
        <div class="side__foot" data-el="sideFoot"></div>
      </nav>

      <main class="main" data-el="main"></main>
    </div>

    <!-- Фокус-сессия: подготовка, конец отрезка, перерыв. Поверх страницы,
         чтобы не терять недописанный ответ экзамена. -->
    <div class="focus-layer" data-el="focusLayer" hidden></div>

    <script type="module" src="./js/learning.js"></script>
  </body>
</html>
