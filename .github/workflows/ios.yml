# «Ноа · Обучение» для iPhone — файл .ipa без подписи.
#
# Полной Ноа для iOS здесь нет (см. конец release.yml): без платного аккаунта
# Apple подписанный установщик не собрать. Это — приложение обучения: окно
# обучения Ноа онлайн во весь экран (mobile/ios-learn). Подписывает его при
# установке Sideloadly — Apple ID владельца телефона, бесплатный тоже годится.
#
# Запуск — руками (вкладка Actions → «iPhone: обучение» → Run workflow) или
# тегом выпуска: тогда файл ложится и в релиз.

name: "iPhone: обучение"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ipa:
    name: iPhone → .ipa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios-learn
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: brew install xcodegen

      - name: Проект Xcode
        run: xcodegen generate

      - name: Сборка без подписи
        run: |
          xcodebuild \
            -project NoahLearn.xcodeproj \
            -scheme NoahLearn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # .ipa — это zip с папкой Payload, в которой лежит .app.
      - name: Файл .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoahLearn.app Payload/
          zip -qry NoahLearn.ipa Payload
          ls -la NoahLearn.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: noah-learning-ios
          path: mobile/ios-learn/NoahLearn.ipa

      # Релиз создаёт release.yml; если он ещё не появился — ждём, а не падаем.
      - name: В релиз
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          cp NoahLearn.ipa "Noah_Learning_${TAG#v}_ios.ipa"
          gh release upload "$TAG" "Noah_Learning_${TAG#v}_ios.ipa" --clobber
