# Ноа для iPhone — файл .ipa без подписи.
#
# Та же программа, что на компьютере и Android: окно обучения, практика,
# модули. Подписанный установщик без платного аккаунта Apple не собрать
# (см. конец release.yml), поэтому файл собирается без подписи, а
# подписывает его при установке Sideloadly — Apple ID владельца телефона,
# бесплатный тоже годится.
#
# Проект Xcode не хранится: его создаёт `tauri ios init`. Сборка — xcodebuild
# с выключенной подписью; Rust собирает шаг самого проекта (xcode-script).
#
# Запуск — руками (Actions → «iPhone» → Run workflow) или тегом выпуска:
# тогда файл ложится и в релиз.

name: "iPhone"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ipa:
    name: iPhone → .ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: XcodeGen
        run: brew install xcodegen

      - name: Проект Xcode
        run: npm run tauri -- ios init --ci

      # Значок — из src-tauri/icons/ios: `ios init` кладёт в проект свой набор,
      # и знак NOAH до телефона не доходил.
      - name: Значок приложения
        run: |
          set -e
          set=$(find src-tauri/gen/apple -type d -name "AppIcon.appiconset" | head -1)
          echo "набор значков: $set"
          cp src-tauri/icons/ios/*.png "$set/"
          ls -la "$set"

      # Голос Ирина (Piper) — в само приложение: говорит без сети, когда голос
      # Ноа с сервера не пришёл. Модель sherpa-onnx (int8, ~20 МБ) кладётся в
      # папку ресурсов проекта (из project.yml), в приложении она —
      # assets/noa-voice; читает её voice_mobile.rs.
      - name: Голос Ирина в приложение
        working-directory: src-tauri/gen/apple
        run: |
          set -e
          assets=$(awk '/- path:/{p=$3} /buildPhase: resources/{print p; exit}' project.yml)
          echo "папка ресурсов: $assets"
          test -n "$assets"
          mkdir -p "$assets/noa-voice"
          curl -fsSL -o /tmp/irina.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-irina-medium-int8.tar.bz2
          tar -xjf /tmp/irina.tar.bz2 -C "$assets/noa-voice"
          find "$assets/noa-voice" -maxdepth 2 | head -20
          du -sh "$assets/noa-voice"

      # Шаг проекта «Build Rust Code» зовёт `tauri ios xcode-script`, а тот
      # ждёт адрес, который оставляет только `tauri ios build`. Та команда без
      # аккаунта Apple не собирает — подпись обязательна. Поэтому Rust
      # собирается здесь, библиотека кладётся туда, где её ждёт проект, а
      # шаг проекта заменяется пустым.
      # Движок голоса (sherpa-onnx) — скачивается здесь, а не пакетом при
      # сборке: кэш Rust восстанавливал собранный пакет без скачанной
      # библиотеки, и компоновка падала («library sherpa-onnx-c-api not
      # found»). Путь к библиотеке — SHERPA_ONNX_LIB_DIR, xcframework — рядом
      # с проектом (его встраивает Xcode по bundle.iOS.frameworks).
      - name: Движок голоса
        run: |
          set -e
          ver=$(grep -A2 'name = "sherpa-onnx-sys"' src-tauri/Cargo.lock | awk -F'"' '/version/{print $2; exit}')
          echo "sherpa-onnx $ver"
          dir="$RUNNER_TEMP/sherpa"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/x.zip" "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v${ver}-ios-shared-onnxruntime-static.xcframework.zip"
          unzip -q "$dir/x.zip" -d "$dir/x"
          xcf=$(find "$dir/x" -type d -name "*.xcframework" | head -1)
          echo "xcframework: $xcf"
          bin=$(find "$xcf" -path "*ios-arm64/*" -name SherpaOnnxC -type f | head -1)
          echo "библиотека: $bin"
          mkdir -p "$dir/lib"
          ln -sf "$bin" "$dir/lib/libsherpa-onnx-c-api.dylib"
          rm -rf src-tauri/sherpa-onnx.xcframework
          cp -R "$xcf" src-tauri/sherpa-onnx.xcframework
          echo "SHERPA_ONNX_LIB_DIR=$dir/lib" >> "$GITHUB_ENV"

      - name: Rust для iPhone
        working-directory: src-tauri
        run: |
          # tauri/custom-protocol — сборка выпуска: интерфейс вшит в программу.
          # Без него Ноа на телефоне шла за интерфейсом на сервер разработки
          # localhost:5173 и показывала только ошибку. Этот признак обычно
          # ставит `tauri build`, которую здесь обходим ради сборки без подписи.
          cargo build --release --lib --target aarch64-apple-ios --features "tauri/custom-protocol ios-plugin"
          mkdir -p gen/apple/Externals/arm64/release
          cp target/aarch64-apple-ios/release/libsufler_lib.a gen/apple/Externals/arm64/release/libapp.a
          ls -la gen/apple/Externals/arm64/release

      - name: Шаг Rust в проекте — пустой
        working-directory: src-tauri/gen/apple
        run: |
          grep -n "xcode-script" project.yml || true
          sed -i '' -E 's#^([ -]*script: ).*xcode-script.*$#\1echo "Rust собран заранее"#' project.yml
          grep -n "Rust собран заранее" project.yml
          xcodegen generate

      # Описания доступа (микрофон, распознавание речи) из src-tauri/Info.ios.plist
      # обычно вливает `tauri ios build`. Без них iOS закрывает программу при
      # первом голосовом вопросе — вливаем сами.
      - name: Info.plist — доступ к микрофону и речи
        working-directory: src-tauri/gen/apple
        run: |
          plist=$(find . -maxdepth 2 -name Info.plist -path "*_iOS/*" | head -1)
          echo "Info.plist: $plist"
          for key in $(/usr/libexec/PlistBuddy -c "Print" ../../Info.ios.plist | awk '/=/{print $1}'); do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" ../../Info.ios.plist)
            type=string
            [ "$value" = "false" ] || [ "$value" = "true" ] && type=bool
            /usr/libexec/PlistBuddy -c "Delete :$key" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key $type '$value'" "$plist"
          done
          /usr/libexec/PlistBuddy -c "Print" "$plist" | grep -E "Usage|DisplayName"

      - name: Сборка без подписи
        working-directory: src-tauri/gen/apple
        run: |
          project=$(ls -d *.xcodeproj | head -1)
          scheme=$(xcodebuild -list -project "$project" | awk '/Schemes:/{getline; gsub(/^ +/, ""); print; exit}')
          echo "проект $project, схема $scheme"
          xcodebuild \
            -project "$project" \
            -scheme "$scheme" \
            -configuration release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # .ipa — это zip с папкой Payload, в которой лежит .app.
      - name: Файл .ipa
        working-directory: src-tauri/gen/apple
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "приложение: $app"
          mkdir -p Payload
          cp -R "$app" Payload/
          # Копия Rust-библиотеки попадает в .app из папки Externals проекта —
          # телефону она не нужна (всё уже в бинарнике), а весит 80 МБ.
          rm -f Payload/*.app/libapp.a
          zip -qry Noah_ios.ipa Payload
          ls -la Noah_ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: noah-ios
          path: src-tauri/gen/apple/Noah_ios.ipa

      # Релиз создаёт release.yml; если он ещё не появился — ждём, а не падаем.
      - name: В релиз
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: src-tauri/gen/apple
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          cp Noah_ios.ipa "Noah_${TAG#v}_ios.ipa"
          gh release upload "$TAG" "Noah_${TAG#v}_ios.ipa" --clobber
