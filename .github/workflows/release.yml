# Сборка установщика.
#
# Почему CI, а не одна машина: Tauri собирает установщик только на той же ОС, для
# которой он предназначен. .exe требует Windows SDK, .dmg — инструментов Apple,
# .deb/.AppImage — Linux. Кросс-сборка официально не поддерживается.
#
# Системы: Windows (.exe), macOS (.dmg, один файл для Intel и Apple Silicon),
# Linux (.AppImage и .deb), Android (.apk). Сайт сам находит файл под систему
# в последнем релизе, поэтому новая система появляется в меню «Скачать» сразу,
# как её файл лёг в релиз.
#
# Запуск: только пуш тега вида v0.1.0 — и никак иначе.
# Результат — опубликованный релиз на GitHub, где под каждую ОС лежит готовый
# установщик: скачал файл, запустил, пользуешься. Командная строка не нужна никому,
# кроме того, кто выпускает версию.
#
# Ручного запуска здесь намеренно нет. Пока он был, каждая проверка сборки
# публиковала релиз вида v8-dev, и список версий заполнялся черновиками, среди
# которых не найти рабочую. Проверять сборку нужно в «Проверочной сборке»
# (dev.yml): она делает тот же установщик, но кладёт его артефактом.
#
# Порядок выпуска: работа идёт в dev → готовое вливается в main → на main
# ставится тег → здесь собирается и публикуется релиз.

name: Установщики

on:
  push:
    tags:
      - "v*"

# Токену нужно право записи: он создаёт релиз и прикладывает к нему файлы.
permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      # Одна упавшая платформа не должна отменять сборку остальных: лучше выпустить
      # три установщика из четырёх, чем ни одного.
      fail-fast: false
      matrix:
        include:
          - label: Windows → .exe
            platform: windows-latest
            args: ""
          # Один .dmg на оба вида Mac: Intel и Apple Silicon.
          - label: macOS → .dmg
            platform: macos-latest
            args: --target universal-apple-darwin
          - label: Linux → .deb, .AppImage
            platform: ubuntu-22.04
            args: --bundles deb,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Окно — WebKitGTK, трей — AppIndicator, звук — ALSA, выделение — X11.
      - name: Системные библиотеки Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libssl-dev libxdo-dev libx11-dev libxtst-dev pkg-config

      - name: Кэш сборки Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Проверки перед сборкой
        run: npm run check

      # Описание релиза собирается из CHANGELOG.md, чтобы в каждой версии было
      # написано, что в ней изменилось, а не один и тот же шаблон.
      # Имя тега идёт через окружение, а не подстановкой ${{ }} в тело скрипта.
      # Подставленное прямо в команду, оно становится частью кода оболочки: тег
      # вида v1.0"; rm -rf /; " выполнился бы как команда. Создавать теги может
      # только тот, у кого есть доступ на запись, но полагаться на это незачем —
      # через переменную оболочка видит готовое значение и кодом его не считает.
      - name: Заметки к версии
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'body<<SUFLER_NOTES_EOF'
            node scripts/release-notes.mjs "$TAG"
            echo
            echo 'SUFLER_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Ключ подписи обновления. Программа ставит поверх себя только тот файл,
      # который подписан этим ключом: обновление приходит по сети, и без подписи
      # подменить его мог бы любой, кто вмешался в соединение. Закрытая половина
      # ключа живёт в секретах репозитория и у того, кто выпускает версии;
      # открытая лежит в tauri.conf.json.
      - name: Сборка установщика
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # latest.json — то, куда смотрит установленная программа: в нём версия,
          # адрес файла и подпись. Без него обновление не находится.
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: Суфлёр ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Публикуем сразу: пуш тега — уже осознанное действие, лишний ручной шаг
          # «опубликовать черновик» только задерживает появление файлов у людей.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Установщик не подписан — платная подпись стоит денег ради личного проекта.
      # Без неё нельзя убрать предупреждение SmartScreen, но можно дать человеку
      # способ убедиться, что скачанный файл — тот же самый, что собрала сборка,
      # а не что-то подменённое по дороге. Хеш добавляется отдельным шагом, а не
      # в release-notes.mjs: он вычисляется из настоящего файла, а не из текста.
      - name: Хеш установщика
        if: matrix.platform == 'windows-latest'
        shell: bash
        # NOTES_BODY передан через env, а не подставлен прямо в run через ${{ }}:
        # текст заметок — это CHANGELOG.md, и в нём уже случались обратные кавычки
        # (`.exe`). Подставленные прямо в скрипт, они выполнились бы как команда
        # оболочки, а не легли текстом — ровно это и произошло с первого раза,
        # «файл `.exe`» превратилось в «файл .». Через env оболочка видит готовое
        # значение переменной и не перечитывает его как код.
        run: |
          file=$(find src-tauri/target/release/bundle/nsis -name '*.exe' | head -n1)
          hash=$(sha256sum "$file" | cut -d' ' -f1)
          {
            printf '%s\n' "$NOTES_BODY"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            printf '%s  %s\n' "$hash" "$(basename "$file")"
            echo '```'
          } > notes-with-hash.md
          gh release edit "$TAG" --notes-file notes-with-hash.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
          TAG: ${{ github.ref_name }}

  # Android — отдельно от настольных: tauri-action телефон не собирает. Файл
  # докладывается в тот же релиз, когда его создали настольные сборки.
  android:
    name: Android → .apk
    needs: desktop
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0

      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri -- android init

      # Плагин выделения подключается к сгенерированному проекту так же, как в
      # проверочной сборке (dev.yml): строка в settings.gradle и зависимость
      # приложения.
      - name: Подключить плагин выделения
        run: |
          {
            echo 'include(":sufler-plugin")'
            echo 'project(":sufler-plugin").projectDir = file("../../../mobile/android-plugin")'
          } >> src-tauri/gen/android/settings.gradle
          gradle_app=src-tauri/gen/android/app/build.gradle.kts
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation(project(":sufler-plugin"))/' "$gradle_app"
          grep -n 'sufler-plugin' "$gradle_app"

      - name: Сборка .apk
        run: npm run tauri -- android build --apk
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
          CARGO_TARGET_I686_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384

      # Неподписанный .apk телефон не ставит. Ключ один на все версии: новая
      # версия ставится поверх старой, только если подписана тем же ключом.
      # Ключ и пароль — в секретах репозитория, на диск раннера ключ ложится
      # во временную папку и сразу удаляется.
      - name: Подписать .apk
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          tools="$ANDROID_HOME/build-tools/34.0.0"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias sufler --ks-pass env:KS_PASS \
            --out "Sufler_${TAG#v}_android.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify "Sufler_${TAG#v}_android.apk"

      - name: Приложить .apk к релизу
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "Sufler_${TAG#v}_android.apk" --clobber

# macOS, Linux и Android собираются с 1.12: до того macOS и Android не
# собирались ни разу, а Linux не выпускался непроверенным. Настольная часть,
# которой у этих систем нет (снимки экрана, связь с запущенной Ноа, голос на
# телефоне), честно говорит об этом, а не падает.
#
# iOS (.ipa) здесь намеренно нет.
#
# Собрать его можно только на macOS-раннере и только с сертификатом Apple Developer
# и provisioning profile — без платного аккаунта установочный файл не создаётся
# в принципе, даже для себя. Плюс на iOS нужен отдельный target Share Extension,
# который добавляется в Xcode вручную (см. mobile/ios-plugin/README.md).
# Добавлять шаг, который гарантированно падает у всех без аккаунта, смысла нет.
